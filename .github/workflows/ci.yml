name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: skynex-simulator } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node --check js/core.js
      - run: node --check js/app.js
      - run: node tools/run_tests.js
      - name: ingest + browser smoke tests
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node tools/ingest_test.js
      - run: python -m py_compile tools/mock_server.py
      - run: pip install websockets && python tools/test_mock_server.py
      - name: single-file build is up to date
        working-directory: .
        run: |
          python skynex-simulator/build.py
          git diff --exit-code --stat -- skynex-simulator-flightview.html
